<style>
  *{box-sizing:border-box;margin:0}
  body{background:#0b0b0b;color:#f2f2f2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
  header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px clamp(16px,4vw,48px);background:rgba(11,11,11,.85);backdrop-filter:blur(10px);border-bottom:1px solid #1f1f1f}
  .logo{display:flex;align-items:center;gap:14px;color:#9a9a9a;font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
  .logo img{height:30px;width:auto;display:block}
  footer img{height:26px;width:auto;display:block;margin:0 auto 12px;opacity:.85}
  a.btn{color:#fff;background:#e11d2e;text-decoration:none;font-weight:600;font-size:14px;padding:10px 16px;border-radius:999px;white-space:nowrap}
  a.btn:hover{background:#ff2a3c}
  main{max-width:1400px;margin:0 auto;padding:clamp(16px,4vw,48px);display:grid;gap:clamp(20px,3vw,40px)}
  figure{position:relative;border-radius:14px;overflow:hidden;border:1px solid #1f1f1f;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  figure img{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#141414}
  figcaption{position:absolute;top:12px;left:12px;font-size:12px;font-weight:700;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:999px}
  .note{text-align:center;color:#9a9a9a;font-size:15px}
  footer{text-align:center;color:#777;font-size:13px;padding:32px 16px 48px}
</style>
